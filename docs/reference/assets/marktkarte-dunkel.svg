<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Positionierungskarte der Coding-Agenten</title>
<desc id="d">Waagrecht die Betriebsbreite (Cloud, Parallelität, PR-Übergabe, Modellvielfalt, 0 bis 4), senkrecht die Prozessbindung (sechs Nachweismerkmale, 0 bis 6). Der Dual-Agent Orchestrator steht allein oben links bei 1 und 6, alle übrigen Produkte liegen zwischen 1,5 und 3 Punkten Prozessbindung.</desc>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.card{fill:#1a1a19;stroke:rgba(255,255,255,0.10)}
.grid{stroke:#2c2c2a;stroke-width:1}
.axis{stroke:#383835;stroke-width:1}
.tick{fill:#898781;font-size:12px}
.title{fill:#ffffff;font-size:17px;font-weight:600}
.sub{fill:#c3c2b7;font-size:12.5px}
.axt{fill:#c3c2b7;font-size:12.5px}
.lbl{fill:#c3c2b7;font-size:12.5px}
.em{fill:#ffffff;font-size:13.5px;font-weight:600}
.dot{fill:#898781;stroke:#1a1a19;stroke-width:2}
.dotem{fill:#3987e5;stroke:#1a1a19;stroke-width:2}
.halo{fill:rgba(57,135,229,0.10)}
.corner{fill:#898781;font-size:11.5px;font-style:italic}
</style>
