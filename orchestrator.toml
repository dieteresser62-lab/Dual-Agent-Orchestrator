[paths]
productive = ["src/**/*.py", "scripts/**/*.py", "schemas/**/*.json", "run_task", "*.toml"]
tests = ["tests/**"]
documentation = ["docs/**", "*.md", "*.puml"]
generated = [".orchestrator/**", "**/__pycache__/**", ".pytest_cache/**"]

[validation]
default_command = ["python3", "-m", "pytest", "tests/", "-v", "-m", "not crash_harness"]

[[provider_input_budget]]
provider = "codex"
role = "codex"
operation = "codex_plan"
max_chars = 4000000
max_bytes = 16000000

